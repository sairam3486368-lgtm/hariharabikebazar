<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Signup - Hari Hara Bike Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <h2>Hari Hara Bike Bazar</h2>
            <p>Create Admin Account</p>
        </div>
        <form id="signupForm" class="login-form">
            <div class="form-group">
                <label for="username">New Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a password" required>
            </div>
            <div id="signupError" class="error-message"></div>
            <div id="signupSuccess" class="error-message" style="color: var(--success-color);"></div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>
        <div style="text-align: center; margin-top: 1rem;">
            <a href="index.html" style="color: var(--primary-color); text-decoration: none; font-size: 0.875rem;">Back to Login</a>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
